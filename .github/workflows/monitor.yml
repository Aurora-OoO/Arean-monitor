name: Monitor Global Call Page

on:
  workflow_dispatch:

jobs:
  monitor:
    name: Check Global Call Availability
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Global Call API
        id: check
        env:
          GLOBALCALL_BASE_URL: ${{ secrets.GLOBALCALL_BASE_URL }}
          GLOBALCALL_ADMIN_KEY: ${{ secrets.GLOBALCALL_ADMIN_KEY }}
          NODE_NO_WARNINGS: '1'
        run: node scripts/monitor.js
      - name: Send DingTalk alert on failure
        if: failure()
        env:
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          GLOBALCALL_BASE_URL: ${{ secrets.GLOBALCALL_BASE_URL }}
          ALERT_SUMMARY: ${{ steps.check.outputs.alert_summary }}
        run: node scripts/notify.js
